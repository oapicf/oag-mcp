- params:
    base: ../../../../..

- description: Command help should display help information
  command: "oag-mcp --help"
  exitcode: 0
  output: "Usage: oag-mcp"

- description: Serve help should list the spec and SDK options
  command: "oag-mcp serve --help"
  exitcode: 0
  output: "--sdk <sdk>"

- description: Unknown commands should be rejected
  command: "oag-mcp frobnicate 2>&1"
  exitcode: 1
  output: "unknown command 'frobnicate'"

- description: Serve should reject positional arguments
  command: "oag-mcp serve ./openapi.yaml --spec {base}/test/fixtures/petclinic/openapi.yaml --sdk {base}/test/fixtures/petclinic/sdk-7.26.0 --log-level silent 2>&1"
  exitcode: 1
  output: "too many arguments for 'serve'"

- description: Serve should require an SDK
  command: "oag-mcp serve --spec {base}/test/fixtures/petclinic/openapi.yaml --log-level silent 2>&1"
  exitcode: 1
  output: "<--sdk <sdk>> must be required"

- description: Serve should require a spec
  command: "oag-mcp serve --sdk {base}/test/fixtures/petclinic/sdk-7.26.0 --log-level silent 2>&1"
  exitcode: 1
  output: "<--spec <spec>> must be required"

- description: Serve should reject a missing SDK with an actionable error
  command: "oag-mcp serve --spec {base}/test/fixtures/petclinic/openapi.yaml --sdk does-not-exist --log-level silent 2>&1"
  exitcode: 1
  output: "SDK_NOT_FOUND"

- description: Serve should reject an SDK from another generator layout
  command: "oag-mcp serve --spec {base}/test/fixtures/petclinic/openapi.yaml --sdk {base}/test/fixtures/petclinic/sdk-7.26.0 --sdk-layout compiled --log-level silent 2>&1"
  exitcode: 1
  output: "SDK_LAYOUT_UNSUPPORTED"

- description: Serve should reject legacy HTTP+SSE as a transport
  command: "oag-mcp serve --spec {base}/test/fixtures/petclinic/openapi.yaml --sdk {base}/test/fixtures/petclinic/sdk-7.26.0 --transport sse --log-level silent 2>&1"
  exitcode: 1
  output: "streamable-http"

- description: Serve should reject an unknown SDK layout
  command: "oag-mcp serve --spec {base}/test/fixtures/petclinic/openapi.yaml --sdk {base}/test/fixtures/petclinic/sdk-7.26.0 --sdk-layout weird --log-level silent 2>&1"
  exitcode: 1
  output: "Allowed choices are auto, source, compiled"

- description: Serve should reject a port outside 0-65535
  command: "oag-mcp serve --spec {base}/test/fixtures/petclinic/openapi.yaml --sdk {base}/test/fixtures/petclinic/sdk-7.26.0 --transport streamable-http --port 99999 --log-level silent 2>&1"
  exitcode: 1
  output: "--port must be an integer between 0 and 65535"

- description: Serve should reject a non-integer port
  command: "oag-mcp serve --spec {base}/test/fixtures/petclinic/openapi.yaml --sdk {base}/test/fixtures/petclinic/sdk-7.26.0 --transport streamable-http --port 3.5 --log-level silent 2>&1"
  exitcode: 1
  output: "--port must be an integer between 0 and 65535"

- description: An unknown log level should be rejected
  command: "oag-mcp serve --spec {base}/test/fixtures/petclinic/openapi.yaml --sdk {base}/test/fixtures/petclinic/sdk-7.26.0 --log-level loud 2>&1"
  exitcode: 1
  output: "Allowed choices are fatal, error, warn, info, debug, trace, silent"
