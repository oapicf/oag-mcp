- params:
    base: ../../../../..

- description: Command help should display help information
  command: "oag-mcp --help"
  exitcode: 0
  output: "Usage: oag-mcp"

- description: Serve help should describe direct serving from a spec and an SDK
  command: "oag-mcp serve --help"
  exitcode: 0
  output: "--sdk <sdk>"

- description: The removed build command should not exist
  command: "oag-mcp build --spec {base}/test/fixtures/petclinic/openapi.yaml --out unused 2>&1"
  exitcode: 1
  output: "unknown command 'build'"

- description: Serve should reject an artifact directory argument with migration guidance
  command: "oag-mcp serve petclinic-server --log-level silent 2>&1"
  exitcode: 1
  output: "--spec ./openapi.yaml --sdk ./generated-sdk"

- description: Serve should require an SDK
  command: "oag-mcp serve --spec {base}/test/fixtures/petclinic/openapi.yaml --log-level silent 2>&1"
  exitcode: 1
  output: "--sdk is required"

- description: Serve should reject a missing SDK with an actionable error
  command: "oag-mcp serve --spec {base}/test/fixtures/petclinic/openapi.yaml --sdk does-not-exist --log-level silent 2>&1"
  exitcode: 1
  output: "SDK_NOT_FOUND"

- description: Serve should reject an SDK from another generator layout
  command: "oag-mcp serve --spec {base}/test/fixtures/petclinic/openapi.yaml --sdk {base}/test/fixtures/petclinic/sdk-7.26.0 --sdk-layout compiled --log-level silent 2>&1"
  exitcode: 1
  output: "SDK_LAYOUT_UNSUPPORTED"

- description: Serve should reject legacy HTTP+SSE as a transport
  command: "oag-mcp serve --spec {base}/test/fixtures/petclinic/openapi.yaml --sdk {base}/test/fixtures/petclinic/sdk-7.26.0 --transport sse --log-level silent 2>&1"
  exitcode: 1
  output: "streamable-http"
