openapi: 3.0.3
info:
  title: Pet Store
  version: 1.0.0
  description: A small pet store API, secured with API key in a header.
servers:
  - url: https://petstore.example.com/v1
tags:
  - name: pets
    description: Pets in the store
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      tags: [pets]
      security: [apiKeyHeader: []]
      parameters:
        - name: limit
          in: query
          description: Maximum number of pets to return
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: The pets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pet' }
    post:
      operationId: createPet
      summary: Register a pet
      tags: [pets]
      security: [apiKeyHeader: []]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewPet' }
      responses:
        '201':
          description: The registered pet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
  /pets/{petId}:
    get:
      operationId: getPetById
      summary: Get a pet
      tags: [pets]
      security: [apiKeyHeader: []]
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The pet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '404':
          description: No such pet
components:
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
  schemas:
    NewPet:
      type: object
      required: [name, species]
      properties:
        name: { type: string }
        species: { type: string, enum: [cat, dog, bird] }
    Pet:
      allOf:
        - $ref: '#/components/schemas/NewPet'
        - type: object
          required: [id]
          properties:
            id: { type: integer }
