# Example configuration for the Upstream credentials recipe
# (docs/recipes/upstream-credentials.md), for the Pet Clinic fixture
# (test/fixtures/petclinic/openapi.yaml). Credentials for each of the
# document's API key, bearer and basic schemes; the admin password comes from
# a secrets file (chmod 600) holding admin_password.
# Secrets are referenced, never inlined:
#   export API_KEY=... API_TOKEN=... ADMIN_USER=...
#   oag-mcp serve --spec test/fixtures/petclinic/openapi.yaml \
#     --sdk test/fixtures/petclinic/sdk-7.26.0 --transport stdio \
#     --config examples/oag-mcp-upstream-credentials.config.yaml
upstream:
  baseUrl: https://api.example.com/v1   # optional: defaults to the OpenAPI document's first server

upstreamAuth:
  secretsFile: ./secrets.yaml           # only needed for { secret: … } references
  schemes:
    apiKeyHeader:
      apiKey: { env: API_KEY }          # from the API_KEY environment variable
    apiKeyQuery:
      apiKey: { env: API_KEY }          # the same key, for operations that take it in the query
    bearerAuth:
      token: { env: API_TOKEN }
    adminBasic:
      username: { env: ADMIN_USER }
      password: { secret: admin_password }   # from the secrets file
